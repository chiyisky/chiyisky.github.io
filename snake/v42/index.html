function pSpeed(){return 1+(boost?.5:0)+(effects.speed?.3:0)}function aSpeed(a){return 1+(a.effects.speed?.3:0)+(a.elite?.05:0)}
function consumeShield(actor,isPlayer){let e=isPlayer?effects:actor.effects;if(!e.shield)return false;e.shield--;actor.protect=Math.max(actor.protect,.8);if(isPlayer)sfx("shield");return true}
function updatePlayer(dt){player.protect=Math.max(0,player.protect-dt);tickEffects(effects,dt);player.a=turn(player.a,targetAngle,TURN*dt);let v=BASE_SPEED*pSpeed();player.x+=Math.cos(player.a)*v*dt;player.y+=Math.sin(player.a)*v*dt;magnet(player,effects,dt);addTrail(player);eat(player,true);collectPower(player,true);if(!inside(player,.45)){if(consumeShield(player,true)){player.x=clamp(player.x,1.4,WORLD-1.4);player.y=clamp(player.y,1.4,WORLD-1.4);player.a=targetAngle=wrap(player.a+2.4)}else diePlayer("撞到边界");return}if(player.protect>0)return;for(const a of ais){if(!a.alive||a.protect>0)continue;if(dist(player,a)<.68){if(effects.shield&&!a.effects.shield){consumeShield(player,true);killAI(a,true);return}diePlayer("正面撞上 AI");return}if(hitTrail(player,a.trail,8,.56)){if(!consumeShield(player,true))diePlayer("撞到 AI 身体");return}}}
function updateAI(a,dt,time){if(!a.alive){a.resp-=dt;if(a.resp<=0)respawnAI(a);return}a.protect=Math.max(0,a.protect-dt);tickEffects(a.effects,dt);let dir=aiDirection(a,time);a.a=turn(a.a,dir,(1.9+difficulty*.18)*dt);let v=AI_SPEED*aSpeed(a);a.x+=Math.cos(a.a)*v*dt;a.y+=Math.sin(a.a)*v*dt;magnet(a,a.effects,dt);addTrail(a);eat(a,false);collectPower(a,false);if(!inside(a,.45)){if(consumeShield(a,false)){a.x=clamp(a.x,1.4,WORLD-1.4);a.y=clamp(a.y,1.4,WORLD-1.4);a.a=wrap(a.a+2.3)}else killAI(a,false);return}if(a.protect>0)return;if(!ended&&player.protect<=0&&dist(a,player)<.68){if(a.effects.shield&&!effects.shield){consumeShield(a,false);diePlayer("被 AI 正面截杀")}else if(effects.shield&&!a.effects.shield){consumeShield(player,true);killAI(a,true)}else diePlayer("正面撞上 AI");return}if(!ended&&hitTrail(a,player.trail,8,.55)){killAI(a,true);return}for(const o of ais)if(o!==a&&o.alive&&o.protect<=0&&dist(a,o)<22&&hitTrail(a,o.trail,8,.55)){killAI(a,false);return}}
function recompute(){let min=elapsed/60;difficulty=Math.min(2.45,1+min*.075+streak*.008);targetAI=Math.round(clamp(14+min*1.12,14,MAX_AI));let live=ais.filter(a=>a.alive);pressure=clamp(live.length/30*.55+live.reduce((s,a)=>s+a.len,0)/(30*220)*.45,0,1.2)}
function supply(){let live=ais.filter(a=>a.alive).length;while(live<targetAI&&ais.length<MAX_AI){ais.push(makeAI());live++}while(foods.length<BASE_FOOD+Math.round((difficulty-1)*70))foods.push(newFood());while(powers.length<8)powers.push(newPower())}
function scr(p){return{x:(p.x-cam.x)*SCALE+W/2,y:(p.y-cam.y)*SCALE+H/2}}function visible(p,pad=40){let q=scr(p);return q.x>-pad&&q.y>-pad&&q.x<W+pad&&q.y<H+pad}function snakeVisible(s,pad=180){if(visible(s,pad))return true;for(let i=0;i<s.trail.length;i+=4)if(visible(s.trail[i],pad))return true;return false}function width(s){return Math.min(27,11+Math.max(0,s.len-80)*.032)}
function path(s){if(!s.trail.length)return;let p=scr(s.trail[0]);ctx.beginPath();ctx.moveTo(p.x,p.y);for(let i=1;i<s.trail.length;i++){let q=scr(s.trail[i]);ctx.lineTo(q.x,q.y)}}
function drawWorld(){ctx.fillStyle="#711b25";ctx.fillRect(0,0,W,H);let tl=scr({x:0,y:0}),br=scr({x:WORLD,y:WORLD}),g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,"#10202c");g.addColorStop(1,"#081018");ctx.fillStyle=g;ctx.fillRect(tl.x,tl.y,br.x-tl.x,br.y-tl.y);ctx.save();ctx.beginPath();ctx.rect(tl.x,tl.y,br.x-tl.x,br.y-tl.y);ctx.clip();ctx.strokeStyle="rgba(255,255,255,.035)";let step=SCALE*2,ox=(((-cam.x*SCALE+W/2)%step)+step)%step,oy=(((-cam.y*SCALE+H/2)%step)+step)%step;for(let x=ox;x<W;x+=step){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=oy;y<H;y+=step){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.restore();ctx.strokeStyle="#ff5268";ctx.lineWidth=5;ctx.strokeRect(tl.x,tl.y,br.x-tl.x,br.y-tl.y)}
function drawSnake(s,isPlayer=false){if(!s.trail.length||!snakeVisible(s,190))return;let sk=SKINS[s.skin],w=width(s),h=scr(s);ctx.save();ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="rgba(0,0,0,.72)";ctx.lineWidth=w+7;path(s);ctx.stroke();ctx.strokeStyle=sk.b;ctx.lineWidth=w+3;ctx.shadowBlur=s.skin==="neon"?18:8;ctx.shadowColor=sk.a;path(s);ctx.stroke();ctx.shadowBlur=0;ctx.strokeStyle=sk.h;ctx.lineWidth=w;path(s);ctx.stroke();ctx.fillStyle=sk.h;ctx.beginPath();ctx.arc(h.x,h.y,w*.65,0,Math.PI*2);ctx.fill();if(!isPlayer&&s.elite){ctx.strokeStyle="#ffe06f";ctx.lineWidth=2;ctx.beginPath();ctx.arc(h.x,h.y,w*.88,0,6.28);ctx.stroke()}if((isPlayer?effects.shield:s.effects.shield)>0){ctx.strokeStyle="#7ee5ff";ctx.lineWidth=2.2;ctx.beginPath();ctx.arc(h.x,h.y,w+7,0,6.28);ctx.stroke()}if(s.protect>0){ctx.strokeStyle="rgba(225,246,255,.72)";ctx.lineWidth=2;ctx.beginPath();ctx.arc(h.x,h.y,Math.max(38,w*2.7),0,6.28);ctx.stroke()}ctx.restore()}
function drawRemains(){for(const r of remains){if(!visible(r,20))continue;let p=scr(r),alpha=clamp(r.ttl/4,0,1);ctx.save();ctx.globalAlpha=alpha;ctx.shadowBlur=14;ctx.shadowColor=r.c;ctx.fillStyle=r.c;ctx.beginPath();ctx.arc(p.x,p.y,r.size,0,6.28);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle="#fff9b5";ctx.beginPath();ctx.arc(p.x-1,p.y-1,Math.max(1.5,r.size*.35),0,6.28);ctx.fill();ctx.restore()}}
function drawPower(p){if(!visible(p,25))return;let q=scr(p),emoji=p.type==="magnet"?"🧲":p.type==="speed"?"⚡":p.type==="shield"?"🛡️":"⭐";ctx.save();ctx.translate(q.x,q.y+Math.sin(performance.now()*.004+p.phase)*2);ctx.fillStyle="rgba(13,27,40,.94)";ctx.strokeStyle="#83dfff";ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,14,0,6.28);ctx.fill();ctx.stroke();ctx.font="15px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(emoji,0,1);ctx.restore()}
function draw(){drawWorld();let tl=scr({x:0,y:0}),br=scr({x:WORLD,y:WORLD});ctx.save();ctx.beginPath();ctx.rect(tl.x,tl.y,br.x-tl.x,br.y-tl.y);ctx.clip();for(const f of foods)if(visible(f,15)){let p=scr(f);ctx.fillStyle=f.c;ctx.beginPath();ctx.arc(p.x,p.y,4,0,6.28);ctx.fill()}drawRemains();powers.forEach(drawPower);for(const a of ais)if(a.alive)drawSnake(a,false);if(!ended)drawSnake(player,true);ctx.restore()}
function updateUI(){aliveEl.textContent=ais.filter(a=>a.alive).length;targetAIEl.textContent=targetAI;killsEl.textContent=kills;difficultyEl.textContent=difficulty.toFixed(2);clockEl.textContent=fmt(elapsed);scoreEl.textContent=Math.round(score);pressureEl.textContent=`竞技场压力 ${Math.round(clamp(pressure,0,1)*100)}%`;streakEl.textContent=`连斩 ${streak}`;speedEl.textContent=`速度 ${Math.round(pSpeed()*100)}%`;for(const k of["magnet","speed","shield","growth"]){fx[k].classList.toggle("on",effects[k]>0);fx[k].textContent=(k==="magnet"?"🧲 磁铁":k==="speed"?"⚡ 疾速":k==="shield"?"🛡️ 护盾":"⭐ 双倍成长")+(effects[k]>0?(k==="shield"?` ×${effects[k]}`:` ${effects[k].toFixed(1)}s`):"")}let rows=[];if(!ended)rows.push({n:"你",l:player.len});for(const a of ais)if(a.alive)rows.push({n:(a.elite?"★ ":"")+SKINS[a.skin].n+" AI",l:a.len});rows.sort((a,b)=>b.l-a.l);leaderEl.innerHTML="<b>排行榜</b>　"+rows.slice(0,5).map((r,i)=>`${i+1}. ${r.n} ${Math.round(r.l)}`).join("　")}
function step(dt,time){if(!running)return;elapsed+=dt;uiTick-=dt;spawnTick-=dt;if(ended){respawn-=dt;if(respawn<=0)respawnPlayer()}else updatePlayer(dt);for(const a of ais)updateAI(a,dt,time);for(let i=remains.length-1;i>=0;i--){remains[i].ttl-=dt;if(remains[i].ttl<=0)remains.splice(i,1)}if(spawnTick<=0){spawnTick=.7;recompute();supply()}let f=1-Math.exp(-7*dt);cam.x+=(player.x-cam.x)*f;cam.y+=(player.y-cam.y)*f;if(uiTick<=0){uiTick=.2;updateUI()}}
function loop(now){let dt=Math.min(.033,(now-last)/1000||.016);last=now;step(dt,now);draw();raf=requestAnimationFrame(loop)}
function reset(){cancelAnimationFrame(raf);score=kills=streak=combo=0;lastKill=-99;elapsed=0;foods=[];powers=[];remains=[];ais=[];effects={magnet:0,speed:0,shield:0,growth:0};player=makePlayer();targetAngle=player.a;cam={x:player.x,y:player.y};ended=false;respawn=0;for(let i=0;i<14;i++)ais.push(makeAI());for(let i=0;i<BASE_FOOD;i++)foods.push(newFood());for(let i=0;i<8;i++)powers.push(newPower());recompute();updateUI();last=performance.now();raf=requestAnimationFrame(loop)}
function moveJoy(e){let b=joy.getBoundingClientRect(),dx=e.clientX-(b.left+b.width/2),dy=e.clientY-(b.top+b.height/2),l=Math.hypot(dx,dy)||1,max=b.width*.29,k=Math.min(1,max/l);stick.style.transform=`translate(${dx*k}px,${dy*k}px)`;if(l>4)targetAngle=Math.atan2(dy,dx)}function clearJoy(){joyId=null;stick.style.transform="translate(0,0)"}
joy.addEventListener("pointerdown",async e=>{await unlockAudio();joyId=e.pointerId;joy.setPointerCapture(e.pointerId);moveJoy(e)});joy.addEventListener("pointermove",e=>{if(e.pointerId===joyId)moveJoy(e)});joy.addEventListener("pointerup",clearJoy);joy.addEventListener("pointercancel",clearJoy);boostBtn.addEventListener("pointerdown",async e=>{await unlockAudio();boostBtn.setPointerCapture(e.pointerId);boost=true;boostBtn.classList.add("active");sfx("boost")});boostBtn.addEventListener("pointerup",()=>{boost=false;boostBtn.classList.remove("active")});boostBtn.addEventListener("pointercancel",()=>{boost=false;boostBtn.classList.remove("active")});
$("startBtn").onclick=async()=>{await unlockAudio();running=true;gate.classList.add("hidden");statusEl.textContent="竞技中";last=performance.now();tone(660,.12,.15,"triangle");tone(990,.16,.13,"triangle",.07)};$("pauseBtn").onclick=async()=>{await unlockAudio();running=!running;$("pauseBtn").textContent=running?"暂停":"继续";statusEl.textContent=running?"竞技中":"已暂停";last=performance.now()};$("restartBtn").onclick=async()=>{await unlockAudio();running=true;gate.classList.add("hidden");reset();statusEl.textContent="竞技中"};musicBtn.onclick=async()=>{await unlockAudio();musicOn=!musicOn;musicBtn.classList.toggle("off",!musicOn);musicOn?startMusic():stopMusic()};sfxBtn.onclick=async()=>{await unlockAudio();sfxOn=!sfxOn;sfxBtn.classList.toggle("off",!sfxOn);sfxBtn.textContent=sfxOn?"🔊":"🔇"};document.querySelectorAll(".skins button").forEach(b=>b.onclick=async()=>{await unlockAudio();currentSkin=b.dataset.skin;player.skin=currentSkin;document.querySelectorAll(".skins button").forEach(x=>x.classList.toggle("active",x===b));$("skinName").textContent=SKINS[currentSkin].n});document.addEventListener("visibilitychange",()=>{if(document.hidden){boost=false;boostBtn.classList.remove("active")}});
window.__snakeTest={snapshot:()=>({version:"V4.2",aliveAI:ais.filter(a=>a.alive).length,targetAI,foods:foods.length,powers:powers.length,remains:remains.length,kills,streak,combo,audioState:audio?audio.state:"none",musicOn,sfxOn}),forceKill:(n=1)=>{for(let i=0;i<n;i++){let a=ais.find(x=>x.alive);if(a)killAI(a,true)}return window.__snakeTest.snapshot()},forceCombo:(n=5)=>{for(let i=0;i<n;i++)recordKill();return{kills,streak,combo}},reset};
reset();
})();
