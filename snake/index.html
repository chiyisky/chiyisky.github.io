<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#071017">
<title>贪吃蛇·大世界竞技 V4.3</title>
<link rel="stylesheet" href="./v43.css?v=20260926-2127">
</head>
<body>
<div class="wrap" id="app">
  <div class="top">
    <div class="stat"><small>得分</small><strong id="score">0</strong></div>
    <div class="center"><div class="status" id="status">点击开始</div><div class="sub"><span id="clock">00:00</span> · AI <b id="alive">0</b>/<b id="targetAI">0</b> · 击杀 <b id="kills">0</b> · 难度 <b id="difficulty">1.00</b></div></div>
    <div class="top-actions"><button class="icon-btn" id="musicBtn" type="button">♫</button><button class="icon-btn" id="sfxBtn" type="button">🔊</button><button id="stop" type="button">暂停</button><button id="restart" type="button">重开</button></div>
  </div>
  <div class="stage">
    <canvas id="board" width="700" height="700"></canvas>
    <div class="corner-badge" id="skinName">青龙</div>
    <div class="kill-flash" id="killFlash"></div>
    <div class="kill-banner" id="killBanner">DOUBLE KILL · 双杀</div>
    <div class="sound-gate" id="soundGate"><div class="sound-card"><button id="startGame" type="button">▶ 开始游戏 · 开启声音</button><small>首次点击后解锁声音；建议打开手机媒体音量</small></div></div>
    <div class="hud-controls"><div class="joy" id="joy" aria-label="方向摇杆"><div class="stick" id="stick"></div></div><button class="boost" id="boost" type="button">⚡ 加速<small>按住</small></button></div>
  </div>
  <div class="meta"><span id="pressureLabel">竞技场压力 0%</span><span id="streakLabel">连斩 0</span><span id="speed">速度 100%</span><span>180×180 大世界</span></div>
  <div class="powerbar"><span class="effect" id="fxMagnet">🧲 磁铁</span><span class="effect" id="fxSpeed">⚡ 疾速</span><span class="effect" id="fxShield">🛡️ 护盾</span><span class="effect" id="fxGrowth">⭐ 双倍成长</span></div>
  <div class="skinbar"><span class="skinlabel">皮肤</span><button class="skin active" data-skin="qinglong">🐉 青龙</button><button class="skin" data-skin="neon">⚡ 霓虹</button><button class="skin" data-skin="lava">🌋 熔岩</button><button class="skin" data-skin="ice">❄️ 冰晶</button><button class="skin" data-skin="star">🌌 星空</button><button class="skin" data-skin="candy">🍬 糖果</button><button class="skin" data-skin="mech">🤖 机甲</button><button class="skin" data-skin="bee">🐝 蜂纹</button></div>
  <div class="leader" id="leader">排行榜加载中…</div>
  <div class="note">V4.3：玩家保留小半径快速绕圈；AI 允许短时绕圈但会强制脱离，不能无限原地绕；AI 新增追击、预判截击、横切封路和主动加速反杀；AI 靠近边界会回场不再突然整条消失；死亡蛇身优先保留为高亮能量豆；战斗音量和连杀震屏继续加强。</div>
</div>
<script src="./v43.js?v=20260926-2127"></script>
</body>
</html>
